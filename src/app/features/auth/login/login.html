<div class="login-container">

  <div class="login-card">

    <h1>Login</h1>

    <input
      type="email"
      placeholder="Enter Email"
      [(ngModel)]="email"
    />

    <input
      type="password"
      placeholder="Enter Password"
      [(ngModel)]="password"
    />

    <button
      type="button"
      (click)="login()"
      [disabled]="!email || !password"
    >
      Login
    </button>

    <h3>{{ message() }}</h3>

    <a routerLink="/register">
      Go to register
    </a>

  </div>

</div>
