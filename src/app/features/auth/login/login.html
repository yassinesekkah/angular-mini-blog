<h1>Login Page</h1>

<input type="email" placeholder="Email" [(ngModel)]="email" />
<br /><br />
<input type="password" placeholder="Password" [(ngModel)]="password" />
<br /><br />

<h3>Email: {{ email }}</h3>
<h3>Password: {{ password }}</h3>

<button (click)="login()" [disabled]="!email || !password">Login</button>
<h2>{{ message }}</h2>

<a routerLink="/register">Go to register</a>
