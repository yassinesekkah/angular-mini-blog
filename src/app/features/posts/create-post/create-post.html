<div class="container">

    <h1>Create Post</h1>

    <input 
        type="text"
        placeholder="Title"
        [(ngModel)]="title" 
    >

    <textarea 
        placeholder="Content"
        [(ngModel)]="content" 
    ></textarea>

    <div class="buttonContainer">
        <button (click)="createPost()">
            Create
        </button>

        <a routerLink="/posts">
            <button>
                Cancel
            </button>
        </a> 
    </div>

    

    <h3>{{ message() }}</h3>
</div>
